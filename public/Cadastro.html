const app = initializeApp(firebaseConfig);

globalThis.registrarUsuarioComEmailESenha = () => {
  console.log("globalThis.registrarUsuarioComEmailESenha = () => {... ");

  let u = document.getElementById("text").value;
  let s = document.getElementById("password").value;

  createUserWithEmailAndPassword(auth,u,s).then(
    (credenciais)=>{
    console.dir(credenciais);
    document.getElementById("usuarioLogadoNoMomento").innerHTML = "";
    document.getElementById("usuarioLogadoNoMomento3").innerHTML = "Usúario Cadastrado!"
   
    document.getElementById("usuarioLogadoNoMomento4").innerHTML = "Faça login para continuar.";

    let docAluno = {
        email: document.getElementById("text").value,
        senha: document.getElementById("password").value,
    } 

    //let autoID = doc().id;
    //console.log(autoID);
    setDoc(doc(window.fbDb, "alunos", new Date().getTime().toString()), docAluno)
  
  }).catch((e)=>{
    console.dir(e);
  });

  

  
  
}//globalThis.registrarUsuarioComEmailESenha = () => {


globalThis.logout = () => {
    try {
        signOut(auth) 
        document.getElementById("usuarioLogadoNoMomento").innerHTML = "";
        document.getElementById("usuarioLogadoNoMomento3").innerHTML = "Usuário deslogado!";

        document.getElementById("usuarioLogadoNoMomento4").innerHTML = ":D";
       console.log('usuário foi deslogado')
    } catch (error) {
       console.log('error:', error)
    }
}
